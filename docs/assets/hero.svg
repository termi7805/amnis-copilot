<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Amnis Copilot</title>
  <desc id="d">Amnis, la mascota de escritorio de Amnis Copilot, saludando con la mano.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1319"/>
      <stop offset="1" stop-color="#1B2430"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#39E0C8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#39E0C8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#39E0C8" stroke-opacity=".06"/>
    </pattern>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#39E0C8"/>
      <stop offset="1" stop-color="#1FB98C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <circle cx="270" cy="210" r="250" fill="url(#glow)"/>

  <!-- Amnis -->
  <g transform="translate(70 46) scale(3.3)">
    <ellipse cx="55" cy="99" rx="30" ry="2.8" fill="#000" opacity=".35"/>
    <!-- cuerpo -->
    <rect x="35" y="72" width="40" height="20" rx="4" fill="#3C4552"/>
    <rect x="41" y="78" width="28" height="2.2" rx="1.1" fill="#2A313B"/>
    <rect x="38" y="91" width="12" height="5" rx="2.5" fill="#2A313B"/>
    <rect x="60" y="91" width="12" height="5" rx="2.5" fill="#2A313B"/>
    <!-- brazo caído -->
    <rect x="25" y="72" width="8" height="15" rx="4" fill="#2F3742"/>
    <!-- cabeza -->
    <line x1="55" y1="22" x2="55" y2="14" stroke="#3C4552" stroke-width="2.6"/>
    <circle cx="55" cy="12" r="3.4" fill="#39E0C8">
      <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="24" y="22" width="62" height="48" rx="7" fill="#4A5563"/>
    <rect x="28" y="26" width="54" height="40" rx="5" fill="#171D26"/>
    <g fill="none" stroke="#39E0C8" stroke-linecap="round">
      <path d="M39 47q5.5-6.5 11 0" stroke-width="3"/>
      <path d="M60 47q5.5-6.5 11 0" stroke-width="3"/>
      <path d="M45 54q10 9 20 0" stroke-width="2.6" opacity=".85"/>
    </g>
    <g fill="#39E0C8" opacity=".18">
      <ellipse cx="38" cy="54" rx="4" ry="2.2"/>
      <ellipse cx="72" cy="54" rx="4" ry="2.2"/>
    </g>
    <!-- brazo saludando -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 76 76;-14 76 76;6 76 76;-14 76 76;0 76 76" keyTimes="0;.25;.5;.75;1" dur="2.4s" repeatCount="indefinite"/>
      <path d="M76 76l14-4 8-22" fill="none" stroke="#2F3742" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="76" cy="76" r="4.6" fill="#2F3742"/>
      <circle cx="98" cy="50" r="4.6" fill="#2F3742"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="520" y="96" font-size="21" font-weight="600" fill="#39E0C8" letter-spacing="3">¡HOLA! SOY AMNIS</text>
    <text x="518" y="170" font-size="72" font-weight="800" fill="#F2F4F6" letter-spacing="-1.5">Amnis Copilot</text>
    <text x="520" y="214" font-size="25" fill="#C6D0DA">La mascota de escritorio que trabaja contigo</text>
    <text x="520" y="248" font-size="25" fill="#C6D0DA">mientras lo hace Claude Code.</text>

    <!-- barra de cuota -->
    <rect x="520" y="292" width="360" height="12" rx="6" fill="#2A313B"/>
    <rect x="520" y="292" width="228" height="12" rx="6" fill="url(#bar)"/>
    <text x="520" y="334" font-size="16" fill="#8AA0B4">Ventana de 5 h · cuanto más gastas, más cansada</text>

    <!-- pills -->
    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="920" y="286" width="112" height="30" rx="15" fill="#39E0C8" fill-opacity=".14" stroke="#39E0C8" stroke-opacity=".5"/>
      <text x="976" y="306" fill="#39E0C8">local-first</text>
      <rect x="1044" y="286" width="112" height="30" rx="15" fill="#FFB020" fill-opacity=".14" stroke="#FFB020" stroke-opacity=".5"/>
      <text x="1100" y="306" fill="#FFB020">sin nube</text>
    </g>
  </g>
</svg>
