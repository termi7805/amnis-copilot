name: Release

# Al subir un tag `vX.Y.Z` se construyen los paquetes de Linux de la mascota
# (con el daemon dentro como sidecar SEA, #41) y se publican como release.
# Así lo que se descarga es exactamente el commit etiquetado, no un build local.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # 22.04 y no latest: la AppImage arrastra la glibc del runner, y una más
    # vieja abre la app en más distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pet/src-tauri

      - run: pnpm install --frozen-lockfile

      # El tag manda: si no coincide con la versión empaquetada, los ficheros
      # saldrían con un número y la release con otro.
      - name: Comprueba que el tag coincide con la versión
        run: |
          version=$(node -p 'require("./apps/pet/src-tauri/tauri.conf.json").version')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "El tag $GITHUB_REF_NAME no coincide con tauri.conf.json ($version)"
            exit 1
          }

      # beforeBuildCommand construye la web y el SEA antes de empaquetar.
      - run: pnpm --filter @amnis/pet build

      # Nombres sin versión: el README enlaza a /releases/latest/download/<nombre>
      # y esos enlaces siguen valiendo en cada release nueva.
      - name: Publica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=apps/pet/src-tauri/target/release/bundle
          mkdir out
          cp "$bundle"/appimage/*.AppImage out/amnis-pet-x86_64.AppImage
          cp "$bundle"/deb/*.deb out/amnis-pet-amd64.deb
          cp "$bundle"/rpm/*.rpm out/amnis-pet-x86_64.rpm
          gh release create "$GITHUB_REF_NAME" \
            --title "Amnis Pet $GITHUB_REF_NAME" \
            --generate-notes \
            out/*
