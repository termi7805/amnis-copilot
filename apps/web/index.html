<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Amnis</title>
<script>
  // Antes del primer render, o se ve un destello del tema equivocado (#80).
  // Caché del tema del daemon (#121); cuando llegan los ajustes, gana el daemon.
  // Los ids salen del catálogo de @amnis/shared (plugin de vite.config.ts).
  try {
    const t = localStorage.getItem("amnis-theme");
    if (t !== "system" && __AMNIS_THEME_IDS__.includes(t)) document.documentElement.dataset.theme = t;
  } catch {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
